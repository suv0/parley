<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Utter: say "Hey Claude", talk, watch the words appear, say "send it", hear the answer</title>
  <!-- One 16-second loop:
       0-3s idle, 3-9s listening (words type into the box), 9-10.5s working, 10.5-16s sent and answered. -->
  <defs>
    <clipPath id="typing">
      <rect x="64" y="186" height="30" width="0">
        <animate attributeName="width" dur="16s" repeatCount="indefinite"
                 values="0;0;560;560;0" keyTimes="0;0.22;0.5;0.656;1" calcMode="linear"/>
      </rect>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
  </defs>

  <!-- the app window -->
  <rect x="0" y="0" width="760" height="330" rx="18" fill="url(#bg)"/>
  <rect x="24" y="20" width="712" height="214" rx="12" fill="#1E293B" stroke="#334155"/>
  <circle cx="44" cy="38" r="5" fill="#F87171"/>
  <circle cx="62" cy="38" r="5" fill="#FBBF24"/>
  <circle cx="80" cy="38" r="5" fill="#34D399"/>
  <text x="380" y="43" fill="#94A3B8" font-size="13" text-anchor="middle">Claude</text>

  <!-- your message, once sent -->
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="0;1;0" keyTimes="0;0.66;0.995"/>
    <rect x="384" y="62" width="330" height="34" rx="17" fill="#2563EB"/>
    <text x="549" y="84" fill="#FFFFFF" font-size="14" text-anchor="middle">Fix the login page on the website.</text>
  </g>

  <!-- Claude's answer, read aloud -->
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="0;1;0" keyTimes="0;0.76;0.995"/>
    <rect x="46" y="108" width="372" height="34" rx="17" fill="#334155"/>
    <text x="66" y="130" fill="#E2E8F0" font-size="14">On it. The login button now checks the form first.</text>
    <!-- speaker with sound waves -->
    <g transform="translate(432,113)" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round">
      <path d="M2 8 h5 l6 -5 v18 l-6 -5 h-5 z" fill="#94A3B8" stroke="none"/>
      <path d="M17 7 q3 5 0 10">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="0.9s" repeatCount="indefinite"/>
      </path>
      <path d="M21 4 q6 8 0 16">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
      </path>
    </g>
    <text x="466" y="130" fill="#64748B" font-size="12">read aloud</text>
  </g>

  <!-- the message box -->
  <rect x="46" y="178" width="668" height="44" rx="10" fill="#0F172A" stroke="#475569"/>
  <text x="64" y="206" fill="#475569" font-size="15">Reply to Claude…
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="1;0;1" keyTimes="0;0.22;0.66"/>
  </text>
  <text x="64" y="206" fill="#F1F5F9" font-size="15" clip-path="url(#typing)">Fix the login page on the website. Send it.
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="1;0;1" keyTimes="0;0.656;0.999"/>
  </text>

  <!-- what you say -->
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="0;1;0" keyTimes="0;0.06;0.19"/>
    <rect x="30" y="252" width="150" height="34" rx="17" fill="#312E81"/>
    <text x="105" y="274" fill="#E0E7FF" font-size="14" text-anchor="middle" font-style="italic">“Hey Claude”</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="0;1;0" keyTimes="0;0.22;0.56"/>
    <rect x="30" y="252" width="150" height="34" rx="17" fill="#312E81"/>
    <text x="105" y="274" fill="#E0E7FF" font-size="14" text-anchor="middle" font-style="italic">you talk…</text>
  </g>

  <!-- the status strip -->
  <rect x="300" y="248" width="436" height="58" rx="10" fill="#1F1F1F" stroke="#3F3F46"/>
  <rect x="704" y="258" width="22" height="20" rx="4" fill="#333333"/>
  <text x="715" y="273" fill="#F2F2F2" font-size="12" font-weight="bold" text-anchor="middle">?</text>

  <!-- the strip's dot: green, red (pulsing), orange, green -->
  <circle cx="320" cy="268" r="6" fill="#22A06B">
    <animate attributeName="fill" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="#22A06B;#E5484D;#F5A524;#22A06B" keyTimes="0;0.1875;0.5625;0.656"/>
    <animate attributeName="r" values="6;7.5;6" dur="0.8s" repeatCount="indefinite"/>
  </circle>

  <g font-size="13" fill="#F2F2F2">
    <text x="336" y="273">Say “Hey Claude” or press ctrl+alt+h
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
               values="1;0;1" keyTimes="0;0.1875;0.9"/>
    </text>
    <text x="336" y="273" opacity="0">Listening → Claude app. When done, say “send it”
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.1875;0.5625"/>
    </text>
    <text x="336" y="273" opacity="0">Getting your words right
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.5625;0.656"/>
    </text>
    <text x="336" y="273" opacity="0">Sent
      <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
               values="0;1;0" keyTimes="0;0.656;0.9"/>
    </text>
  </g>
  <text x="336" y="293" fill="#A0A0A0" font-size="12" opacity="0">fix the login page on the website
    <animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="discrete"
             values="0;1;0" keyTimes="0;0.3;0.5625"/>
  </text>
  <text x="300" y="322" fill="#64748B" font-size="11">the status strip: always on top, drag it anywhere</text>
</svg>
